name: Deploy to App Runner

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - "backend/tests/**"
      - "prompt/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: consensus-production-deploy
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "645674817582"
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: consensus

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::645674817582:role/ConsensusGitHubActionsEcrPushRole
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Sign in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and publish deploy image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preserve immutable rollback tag
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Rollback tag already exists: $GITHUB_SHA"
            exit 0
          fi

          manifest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=deploy \
            --query 'images[0].imageManifest' \
            --output text)"

          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "$GITHUB_SHA" \
            --image-manifest "$manifest" >/dev/null
          echo "Created rollback tag: $GITHUB_SHA"
